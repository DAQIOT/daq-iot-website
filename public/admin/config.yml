backend:
  name: github
  repo: DAQIOT/daq-iot-website
  branch: main
  base_url: https://daq-iot.pages.dev
  auth_endpoint: /oauth/auth
  site_id: daq-iot-website
locale: zh_Hans
media_folder: public/images
public_folder: /images
# ── 图片物理分类约定 ──
# 语言相关的产品图请用文件名前缀区分：en-（英文）/ zh-（中文）/ de-（德文），如 en-scada-cover.jpg
# 也可手动归入 public/images/en、public/images/zh、public/images/de 子文件夹（已建好，含 .gitkeep）
# 说明：Decap 默认媒体库是平铺的，上传只能进 public/images 根目录，不会自动按语言分文件夹；
# 若想要"在后台点进子文件夹再上传"，需安装 decap-cms-media-library-folders 插件（ESM 接入，
# 与当前 CDN 式后台有兼容性风险，且无法本地登录实测，需上线后登录后台确认）。

i18n:
  structure: multiple_folders
  locales:
    - en
    - zh
    - de
  default_locale: zh
collections:
  # ── 产品 / 产品分类：单一集合定义（模板）──
  # 实际后台由 admin/init-cms.js 根据顶部语言下拉动态派生：
  # 选择哪种语言，【产品】【产品分类】两个入口就只显示/管理该语言目录
  # （src/content/products/zh|en|de、src/content/categories/zh|en|de），
  # 添加/删除/编辑都只影响当前语言，各语言内容完全独立。
  - name: products
    label: 产品
    folder: src/content/products
    i18n: true
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{title}}'
    fields:
      - label: 产品名称（必填）
        name: title
        widget: string
        required: true
        i18n: true
        hint: 填写当前语言的产品名称（中文产品填中文，英文产品填英文）
      - label: 一句话描述（必填）
        name: summary
        widget: text
        required: true
        i18n: true
        hint: 产品一句话介绍，20-50 字左右
      - label: 产品图片（选填）
        name: image
        widget: image
        required: false
        i18n: duplicate
        hint: 产品图片，各语言可以使用不同图片
      - label: 排序（选填，数字越小越靠前）
        name: order
        widget: number
        value_type: int
        default: 0
        pattern: ['^[0-9]+$', '只能填数字']
        i18n: duplicate
      - label: 产品分类（必填）
        name: category
        widget: relation
        collection: categories
        display_fields: [path]
        search_fields: [name, path]
        value_field: slug
        required: true
        i18n: true
        hint: 只显示当前语言的分类。带"父级名 / 分类名"（如"仪器仪表采集 / 电表采集"、"Instrumentation / Instrument Acquisition"）的是二级分类，有二级的一级分类请选到具体的二级分类
      - label: 产品参数（选填）
        name: parameters
        widget: markdown
        required: false
        i18n: true
        hint: 支持 Markdown，可用表格 / 列表自由排版产品参数
      - label: 详细介绍（必填）
        name: body
        widget: markdown
        required: true
        i18n: true
        hint: 产品详细介绍，支持 Markdown 格式
  - name: categories
    label: 产品分类
    folder: src/content/categories
    i18n: true
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    # 列表按"分类显示路径"显示，二级分类直接看出层级（如 仪器仪表采集 / 电表采集）
    summary: '{{fields.path}}'
    sortable_fields: [path, order]
    sort_by: path
    # 按父级分组：二级分类直接归到所属父级组下，实现"二级在父类下面"的层级展示
    view_groups:
      - label: 按父级分组
        field: parent
    fields:
      - label: 语言标识（自动，勿改）
        name: lang
        widget: hidden
        default: zh
        i18n: duplicate
      - label: URL标识 slug（必填，只能英文小写，不能用空格）
        name: slug
        widget: string
        required: true
        pattern: ['^[a-z0-9-]+$', '只能小写字母、数字和连字符，例如 daq-meter-electric']
        hint: 中文分类 slug 用 daq- 开头（daq-meter/daq-sensor/daq-camera/daq-gateway/daq-software/daq-install）；英文/德文用英文 slug（instrumentation/wirelesssensor/wirelesstimingphotography/plcacquisition/dataacquisitionsoftware）。二级分类用"父级slug-子级名"命名，如 daq-meter-electric、instrument-acquisition
        i18n: duplicate
      - label: 排序(数字越小越靠前)
        name: order
        widget: number
        value_type: int
        default: 0
        i18n: duplicate
      - label: 父级分类（选填，留空为一级分类；有父级即二级分类）
        name: parent
        widget: relation
        collection: categories
        display_fields: [path]
        search_fields: [name, path]
        value_field: slug
        required: false
        i18n: true
        hint: 二级分类必须选择父级。当前中文二级：电表采集/其他类仪表采集（父级=仪器仪表采集）、电力类传感器/环境类传感器（父级=无线传感器）；英文/德文二级：Instrument Acquisition / Instrumentenerfassung（父级=Instrumentation / Instrumentierung）
      - label: 分类显示路径（后台列表与下拉用）
        name: path
        widget: string
        required: false
        i18n: true
        hint: 一级分类填分类名称即可；二级分类填"父级名 / 分类名"，如"仪器仪表采集 / 电表采集"、"Instrumentation / Instrument Acquisition"
      - label: 分类名称（必填）
        name: name
        widget: string
        required: true
        i18n: true
      - label: 分类说明
        name: description
        widget: text
        required: false
        i18n: true
  - name: posts
    label: 博客文章
    folder: src/content/posts
    i18n: true
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{title}}'
    fields:
      - label: 标题
        name: title
        widget: string
        i18n: true
      - label: 描述
        name: description
        widget: text
        i18n: true
      - label: 发布日期
        name: pubDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        i18n: duplicate
      - label: 作者
        name: author
        widget: string
        required: false
        i18n: duplicate
      - label: 封面图
        name: image
        widget: image
        required: false
        i18n: true
      - label: 正文
        name: body
        widget: markdown
        i18n: true
  - name: site
    label: 网站基础文案
    folder: src/content/site
    create: false
    i18n: false
    identifier_field: editor_lang
    fields:
      - label: 语言
        name: editor_lang
        widget: string
      - label: 导航栏
        name: nav
        widget: object
        fields:
          - name: home
            label: 首页
            widget: string
          - name: about
            label: 关于我们
            widget: string
          - name: products
            label: 产品中心
            widget: string
          - name: solutions
            label: 解决方案
            widget: string
          - name: services
            label: 服务
            widget: string
          - name: partners
            label: 合作伙伴
            widget: string
          - name: support
            label: 支持
            widget: string
          - name: contact
            label: 联系我们
            widget: string
          - name: cta
            label: 右上角按钮(获取报价)
            widget: string
      - label: 网站标题与描述(SEO)
        name: hero
        widget: object
        fields:
          - name: title
            label: 网站标题
            widget: string
          - name: subtitle
            label: 网站描述
            widget: text
          - name: ctaPrimary
            label: 主按钮文字
            widget: string
          - name: ctaSecondary
            label: 次按钮文字
            widget: string
      - label: 首页
        name: home
        widget: object
        fields:
          - name: eyebrow
            label: 顶部小标签
            widget: string
          - name: heroTitle
            label: 大标题
            widget: string
          - name: heroSubtitle
            label: 大标题下方描述
            widget: text
          - name: heroCta1
            label: 按钮1文字
            widget: string
          - name: heroCta2
            label: 按钮2文字
            widget: string
          - name: categoriesTitle
            label: 五大产品矩阵标题
            widget: string
          - name: categoriesSubtitle
            label: 副标题
            widget: text
          - name: viewAll
            label: 查看全部产品
            widget: string
          - name: solutionsTitle
            label: 行业解决方案标题
            widget: string
          - name: solutionsSubtitle
            label: 副标题
            widget: text
          - label: 行业列表(可增删)
            name: industries
            widget: list
            fields:
              - name: label
                label: 行业名称
                widget: string
          - name: statsTitle
            label: 数据基石标题
            widget: string
          - label: 数据指标(可增删)
            name: stats
            widget: list
            fields:
              - name: value
                label: 数值
                widget: string
              - name: label
                label: 说明文字
                widget: string
          - name: partnersTitle
            label: 合作伙伴标题
            widget: string
          - name: partnersSubtitle
            label: 副标题
            widget: text
          - name: ctaTitle
            label: 底部CTA标题
            widget: string
          - name: ctaSubtitle
            label: 副标题
            widget: text
          - name: ctaButton
            label: 按钮文字
            widget: string
      - label: 为什么选择(首页特色)
        name: features
        widget: object
        fields:
          - name: title
            label: 标题
            widget: string
          - name: subtitle
            label: 副标题
            widget: text
          - name: feature1Title
            label: 特色1标题
            widget: string
          - name: feature1Desc
            label: 特色1描述
            widget: text
          - name: feature2Title
            label: 特色2标题
            widget: string
          - name: feature2Desc
            label: 特色2描述
            widget: text
          - name: feature3Title
            label: 特色3标题
            widget: string
          - name: feature3Desc
            label: 特色3描述
            widget: text
          - name: feature4Title
            label: 特色4标题
            widget: string
          - name: feature4Desc
            label: 特色4描述
            widget: text
          - name: feature5Title
            label: 特色5标题
            widget: string
          - name: feature5Desc
            label: 特色5描述
            widget: text
          - name: feature6Title
            label: 特色6标题
            widget: string
          - name: feature6Desc
            label: 特色6描述
            widget: text
      - label: 通用CTA区块
        name: cta
        widget: object
        fields:
          - name: title
            label: 标题
            widget: string
          - name: subtitle
            label: 副标题
            widget: text
          - name: button
            label: 按钮文字
            widget: string
      - label: 产品页
        name: products
        widget: object
        fields:
          - name: title
            label: 标题
            widget: string
          - name: subtitle
            label: 副标题
            widget: text
          - name: back
            label: 返回产品
            widget: string
          - name: all
            label: 全部产品
            widget: string
          - name: empty
            label: 空分类提示
            widget: string
      - label: 页脚
        name: footer
        widget: object
        fields:
          - name: contact
            label: 联系方式标题
            widget: string
          - name: products
            label: 产品标题
            widget: string
          - name: solutions
            label: 解决方案标题
            widget: string
          - name: company
            label: 公司标题
            widget: string
          - name: rights
            label: 版权信息
            widget: string
          - name: tagline
            label: 标语
            widget: string
  - name: solutions
    label: 解决方案
    folder: src/content/solutions
    create: false
    i18n: false
    identifier_field: editor_lang
    fields:
      - label: 语言
        name: editor_lang
        widget: string
      - name: title
        label: 标题
        widget: string
      - name: subtitle
        label: 副标题
        widget: text
      - name: p1
        label: 段落
        widget: text
      - label: 方案列表(可增删)
        name: items
        widget: list
        fields:
          - name: title
            label: 方案标题
            widget: string
          - name: desc
            label: 方案描述
            widget: text
  - name: services
    label: 服务与支持
    folder: src/content/services
    create: false
    i18n: false
    identifier_field: editor_lang
