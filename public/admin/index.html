<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAQ-IOT 内容管理后台</title>
    <style>
      html, body { height: 100%; margin: 0; padding: 0; }
      body { display: flex; flex-direction: column; }
      #cms-lang-banner { flex-shrink: 0; }
      #nc-root { flex: 1 1 auto; min-height: 0; overflow: hidden; }
      /* CMS 顶部语言切换 banner（文档流内，flex 布局下 CMS 自动排在 banner 下方） */
      #cms-lang-banner {
        height: 38px;
        width: 100%;
        box-sizing: border-box;
        background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
        color: #f9fafb;
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        position: relative;
        z-index: 100;
      }
      #cms-lang-banner .label {
        font-weight: 600;
        margin-right: 8px;
        color: #d1d5db;
        white-space: nowrap;
      }
      #cms-lang-select {
        background: #4b5563;
        color: #f9fafb;
        border: 1px solid #6b7280;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
        outline: none;
      }
      #cms-lang-select:hover { background: #6b7280; }
      #cms-lang-select:focus { border-color: #60a5fa; }
      #cms-lang-banner .hint {
        margin-left: 10px;
        opacity: 0.7;
        font-size: 11px;
        color: #d1d5db;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (max-width: 640px) {
        #cms-lang-banner .hint { display: none; }
      }
      /* Decap i18n 双栏真实类名为 .Pane（默认只有 height:100% 没有 overflow）。
         仅给 .Pane 自身加 overflow-y:auto 让其可滚动；
         切勿给 .Pane 的子 div 强加 overflow/height，否则会创建独立滚动层、
         拦截 Decap markdown 编辑器的「编辑区↔预览区」同步滚动事件。 */
      .Pane {
        overflow-y: auto !important;
        height: 100% !important;
        max-height: 100% !important;
      }
      [class*="split-pane"],
      [class*="SplitPane"] { height: 100% !important; }
    </style>
  </head>
  <body>
    <!-- CMS 顶部语言切换 banner：切换后整个后台内容（产品/产品分类）切换为所选语言 -->
    <div id="cms-lang-banner">
      <span class="label">后台语言 / Language</span>
      <select id="cms-lang-select">
        <option value="zh">中文（默认）</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
      <span class="hint">切换后【产品】【产品分类】整个后台只显示所选语言的内容</span>
    </div>
    <div id="nc-root"></div>
    <!-- 手动初始化：由 init-cms.js 按所选语言派生集合后再 CMS.init -->
    <script>window.CMS_MANUAL_INIT = true;</script>
    <!-- 本地 vendor 脚本（海外 CDN 在国内不稳定，全部本地化） -->
    <script src="./vendor/decap-cms/decap-cms.js"></script>
    <script src="./vendor/js-yaml.min.js"></script>
    <!-- 按语言动态初始化（fetch config.yml -> 派生当前语言的集合 -> CMS.init） -->
    <script src="./init-cms.js?v=9"></script>
    <!-- 自定义语言切换逻辑 -->
    <script src="./lang-switcher.js?v=9"></script>
    <!-- marked：预览模板里把 body 的 Markdown 渲染成带表格/列表的 HTML -->
    <script src="./vendor/marked.min.js"></script>
    <!-- aiiot 自定义 Preview 模板（产品/博客），依赖上面的 h/createClass 与 marked -->
    <script src="./preview.js"></script>
    <script>
      // 仅兜底：确保动态生成的 .Pane 拿到 overflow-y:auto，不接管滚轮
      (function () {
        function fixPanes() {
          document.querySelectorAll('.Pane').forEach(function (p) {
            if (p.dataset.scrollFixed) return;
            p.style.overflowY = 'auto';
            p.dataset.scrollFixed = '1';
          });
        }
        // 集合列表页没有 .Pane，需要让 #nc-root 本身可滚动；编辑页有 .Pane 时保持 hidden
        function fixRootScroll() {
          var root = document.getElementById('nc-root');
          if (!root) return;
          var hasPanes = document.querySelectorAll('.Pane').length > 0;
          root.style.overflow = hasPanes ? 'hidden' : 'auto';
        }
        function runAll() {
          fixPanes();
          fixRootScroll();
        }
        if (window.MutationObserver) {
          new MutationObserver(runAll).observe(document.body, { childList: true, subtree: true });
        }
        setInterval(runAll, 1000);
        runAll();
      })();

      // 把 Decap 预览面板里那句容易误会的“点击以预览”改成“产品页预览”
      // （Decap 自带中文文案，不在小眼睛旁边、不像按钮，常让人误点。仅改显示文字，不改功能）
      (function () {
        function relabel() {
          var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
          var node;
          while ((node = walker.nextNode())) {
            if (node.nodeValue && node.nodeValue.indexOf('点击以预览') !== -1) {
              node.nodeValue = node.nodeValue.replace('点击以预览', '产品页预览');
            }
          }
        }
        if (window.MutationObserver) {
          new MutationObserver(relabel).observe(document.body, { childList: true, subtree: true, characterData: true });
        }
        setInterval(relabel, 1500);
        relabel();
      })();
    </script>
  </body>
</html>
